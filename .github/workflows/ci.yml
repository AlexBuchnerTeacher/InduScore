name: CI

on:
  push:
    branches: ["main", "feature/**", "release/**"]
  pull_request:
    branches: ["**"]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.dartServer/.analysis-driver
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Check Coverage Threshold
        run: |
          # Parse lcov.info to calculate coverage percentage
          # Exclude generated files (.g.dart, .freezed.dart) and firebase_options.dart
          TOTAL_LINES=$(grep -v '\.g\.dart\|\.freezed\.dart\|firebase_options\.dart' coverage/lcov.info | grep '^DA:' | wc -l)
          HIT_LINES=$(grep -v '\.g\.dart\|\.freezed\.dart\|firebase_options\.dart' coverage/lcov.info | grep '^DA:' | grep -v ',0$' | wc -l)
          
          if [ "$TOTAL_LINES" -gt 0 ]; then
            COVERAGE=$(awk "BEGIN {printf \"%.2f\", ($HIT_LINES / $TOTAL_LINES) * 100}")
            echo "Coverage: $COVERAGE% ($HIT_LINES/$TOTAL_LINES lines)"
            
            # Temporary lower threshold during refactoring - will increase to 50% after Phase 2
            MIN_COVERAGE=35
            
            if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
              echo "❌ Coverage $COVERAGE% is below minimum $MIN_COVERAGE%"
              exit 1
            else
              echo "✅ Coverage $COVERAGE% meets minimum $MIN_COVERAGE%"
            fi
          else
            echo "⚠️  No coverage data found"
            exit 1
          fi

      # Version check removed - now using package_info_plus
      # which reads version directly from pubspec.yaml (single source of truth)

name: CI

on:
  push:
    branches: ["main", "feature/**", "release/**"]
  pull_request:
    branches: ["**"]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.dartServer/.analysis-driver
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Check Coverage Threshold
        run: |
          # Install very_good_coverage for coverage threshold checking
          dart pub global activate very_good_coverage
          # Check minimum 50% coverage (Issue #51 F07)
          # Exclude generated files (.g.dart, .freezed.dart)
          dart pub global run very_good_coverage:very_good_coverage \
            --min-coverage 50 \
            --exclude '**/*.g.dart' \
            --exclude '**/*.freezed.dart'

      # Version check removed - now using package_info_plus
      # which reads version directly from pubspec.yaml (single source of truth)
